<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<style>
  .btn { font-family:var(--font-interface); font-weight:600; font-size:13px;
         border:1px solid var(--glass-border); border-radius:10px; padding:10px 16px;
         background:var(--dark-700); color:var(--light-200); cursor:pointer;
         display:inline-flex; align-items:center; gap:8px; transition:all .3s var(--ease-smooth); }
  .btn.primary    { background:var(--accent-cyan); border-color:var(--accent-cyan); color:#fff; }
  .btn.gradient   { background:linear-gradient(135deg,#3b82f6,#8b5cf6); border:0; color:#fff; }
  .btn.outline    { background:transparent; border-color:var(--accent-cyan); color:var(--accent-cyan); }
  .btn.ghost      { background:transparent; border-color:transparent; color:var(--light-300); }
  .btn.danger     { background:#ef4444; border-color:#ef4444; color:#fff; }
  .btn.icon-only  { width:36px; height:36px; padding:0; justify-content:center; border-radius:8px; }
</style>
<div class="card">
  <div class="kicker">Buttons · primary, gradient, outline, ghost, danger</div>
  <div class="row" style="gap:10px;">
    <button class="btn primary"><i class="fas fa-paper-plane"></i>Send</button>
    <button class="btn gradient"><i class="fas fa-bolt"></i>Unlimited</button>
    <button class="btn outline"><i class="fas fa-microscope"></i>Research</button>
    <button class="btn"><i class="fas fa-folder"></i>Open</button>
    <button class="btn ghost">Cancel</button>
    <button class="btn danger"><i class="fas fa-triangle-exclamation"></i>Abort</button>
  </div>
  <div class="row" style="gap:10px;">
    <button class="btn icon-only"><i class="fas fa-microphone"></i></button>
    <button class="btn icon-only"><i class="fas fa-camera"></i></button>
    <button class="btn icon-only"><i class="fas fa-cog"></i></button>
    <button class="btn icon-only" style="background:var(--accent-cyan);color:#fff;border-color:var(--accent-cyan);"><i class="fas fa-paper-plane"></i></button>
    <button class="btn"><i class="fas fa-plus"></i>New project</button>
    <button class="btn"><i class="fas fa-sync"></i>Sync all</button>
  </div>
</div>
</body></html>
