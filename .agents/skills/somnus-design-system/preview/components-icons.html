<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<style>
  .ic { width:36px; height:36px; border-radius:8px; background:var(--dark-700);
        border:1px solid var(--glass-border); display:flex; align-items:center; justify-content:center;
        color:var(--light-200); font-size:14px; }
  .lbl { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.14em;
         color:var(--light-400); text-align:center; margin-top:5px; line-height:1.2; }
  .col { display:flex; flex-direction:column; align-items:center; min-width:0; }
</style>
<div class="card">
  <div class="kicker">Iconography · Font Awesome 6 (the workhorse)</div>
  <div class="row" style="gap:14px; justify-content:flex-start;">
    <div class="col"><div class="ic"><i class="fas fa-paper-plane"></i></div><div class="lbl">send</div></div>
    <div class="col"><div class="ic"><i class="fas fa-microphone"></i></div><div class="lbl">voice</div></div>
    <div class="col"><div class="ic"><i class="fas fa-camera"></i></div><div class="lbl">vision</div></div>
    <div class="col"><div class="ic"><i class="fas fa-microscope"></i></div><div class="lbl">research</div></div>
    <div class="col"><div class="ic"><i class="fas fa-cube"></i></div><div class="lbl">artifact</div></div>
    <div class="col"><div class="ic"><i class="fas fa-folder"></i></div><div class="lbl">project</div></div>
    <div class="col"><div class="ic"><i class="fas fa-brain"></i></div><div class="lbl">train</div></div>
    <div class="col"><div class="ic"><i class="fab fa-git-alt"></i></div><div class="lbl">git</div></div>
  </div>
  <div class="row" style="gap:14px; justify-content:flex-start;">
    <div class="col"><div class="ic"><i class="fas fa-shield-halved"></i></div><div class="lbl">sovereignty</div></div>
    <div class="col"><div class="ic"><i class="fas fa-satellite"></i></div><div class="lbl">orbital</div></div>
    <div class="col"><div class="ic"><i class="fas fa-globe"></i></div><div class="lbl">geo</div></div>
    <div class="col"><div class="ic"><i class="fas fa-bolt"></i></div><div class="lbl">unlimited</div></div>
    <div class="col"><div class="ic"><i class="fas fa-crosshairs"></i></div><div class="lbl">target</div></div>
    <div class="col"><div class="ic"><i class="fas fa-triangle-exclamation"></i></div><div class="lbl">threat</div></div>
    <div class="col"><div class="ic"><i class="fas fa-network-wired"></i></div><div class="lbl">graph</div></div>
    <div class="col"><div class="ic"><i class="fas fa-database"></i></div><div class="lbl">store</div></div>
  </div>
</div>
</body></html>
