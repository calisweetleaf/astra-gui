<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<style>
  .row-tok { display:flex; align-items:center; gap:14px; }
  .bar { background:var(--accent-cyan); height:14px; border-radius:3px; }
  .name { font-family:var(--font-mono); font-size:11px; color:var(--light-300); width:64px; text-transform:uppercase; letter-spacing:.12em; }
  .px   { font-family:var(--font-mono); font-size:11px; color:var(--light-400); margin-left:auto; }
</style>
<div class="card">
  <div class="kicker">Spacing scale · 4px rhythm</div>
  <div class="row-tok"><span class="name">2xs</span><div class="bar" style="width:2px;"></div><span class="px">2px</span></div>
  <div class="row-tok"><span class="name">xs</span><div class="bar" style="width:4px;"></div><span class="px">4px</span></div>
  <div class="row-tok"><span class="name">sm</span><div class="bar" style="width:8px;"></div><span class="px">8px</span></div>
  <div class="row-tok"><span class="name">md</span><div class="bar" style="width:16px;"></div><span class="px">16px</span></div>
  <div class="row-tok"><span class="name">lg</span><div class="bar" style="width:24px;"></div><span class="px">24px</span></div>
  <div class="row-tok"><span class="name">xl</span><div class="bar" style="width:32px;"></div><span class="px">32px</span></div>
  <div class="row-tok"><span class="name">2xl</span><div class="bar" style="width:48px;"></div><span class="px">48px</span></div>
  <div class="row-tok"><span class="name">3xl</span><div class="bar" style="width:64px;"></div><span class="px">64px</span></div>
</div>
</body></html>
