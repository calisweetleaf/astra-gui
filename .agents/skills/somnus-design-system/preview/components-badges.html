<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<style>
  .badge { font-family:var(--font-mono); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.18em;
           padding:5px 10px; border-radius:6px; display:inline-flex; align-items:center; gap:6px; }
  .pill  { font-family:var(--font-interface); font-size:12px; font-weight:600;
           padding:6px 14px; border-radius:9999px; display:inline-flex; align-items:center; gap:8px; color:#fff; }
  .dot   { width:6px; height:6px; border-radius:50%; }
  .pulse { animation:pulse-dot 2s var(--ease-smooth) infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.45} }
</style>
<div class="card">
  <div class="kicker">Status badges · threat + system</div>
  <div class="row" style="gap:10px;">
    <span class="badge" style="background:rgba(220,38,38,.18); color:#fca5a5; border:1px solid rgba(220,38,38,.4);"><span class="dot pulse" style="background:#dc2626;"></span>INSTITUTIONAL CAPTURE</span>
    <span class="badge" style="background:rgba(249,115,22,.18); color:#fdba74; border:1px solid rgba(249,115,22,.4);"><span class="dot pulse" style="background:#f97316;"></span>HIGH INFLUENCE</span>
    <span class="badge" style="background:rgba(245,158,11,.18); color:#fcd34d; border:1px solid rgba(245,158,11,.4);">CONCERNING</span>
    <span class="badge" style="background:rgba(16,185,129,.18); color:#6ee7b7; border:1px solid rgba(16,185,129,.4);"><span class="dot" style="background:#10b981;"></span>OPERATIONAL</span>
  </div>
  <div class="row" style="gap:10px;">
    <span class="pill" style="background:linear-gradient(135deg,#3b82f6,#8b5cf6);">UNLIMITED</span>
    <span class="pill" style="background:linear-gradient(135deg,#10b981,#06b6d4);"><i style="width:6px;height:6px;border-radius:50%;background:#fff;"></i>AI Sovereignty Active</span>
    <span class="pill" style="background:var(--dark-700); border:1px solid var(--glass-border); color:var(--accent-cyan);">5 Active</span>
    <span class="pill" style="background:var(--dark-700); border:1px solid var(--glass-border); color:var(--light-300);">3 Projects · Synced</span>
  </div>
</div>
</body></html>
