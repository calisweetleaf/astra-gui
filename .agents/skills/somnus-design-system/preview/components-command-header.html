<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="command">
<style>
  .panel { width:100%; background:rgba(15,20,28,.94); backdrop-filter:blur(32px) saturate(1.2);
           border:1px solid rgba(6,182,212,.30); border-radius:14px; padding:14px 18px;
           display:flex; align-items:center; gap:18px; position:relative; overflow:hidden;
           box-shadow:0 16px 64px rgba(0,0,0,.6); }
  .panel::before { content:""; position:absolute; top:0; left:0; right:0; height:2px;
                   background:linear-gradient(90deg,#06b6d4,#8b5cf6,#0891b2); opacity:.85; }
  .title { font-family:'Orbitron',sans-serif; font-weight:700; font-size:14px; letter-spacing:.16em;
           color:var(--accent-cyan); text-transform:uppercase; }
  .sep   { color:var(--light-500); margin:0 4px; }
  .stat { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .stat .v { font-family:var(--font-mono); font-weight:700; font-size:13px; color:var(--accent-cyan); }
  .stat .l { font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.18em; color:var(--light-400); }
  .ind   { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--light-200); }
  .ind .d { width:8px; height:8px; border-radius:50%; }
  .v-orange { color:#fdba74; }
  .v-red    { color:#fca5a5; }
  .v-green  { color:#6ee7b7; }
</style>
<div class="card">
  <div class="kicker">Command header · status bar with HUD rule</div>
  <div class="panel">
    <i class="fas fa-shield-halved" style="font-size:18px; color:var(--accent-cyan);"></i>
    <div class="title">REM-Core <span class="sep">//</span> Strategic Intel</div>
    <div style="flex:1;"></div>
    <div class="ind"><span class="d" style="background:#f97316;"></span>Corporate <span class="v-orange">HIGH</span></div>
    <div class="ind"><span class="d" style="background:#ef4444;"></span>Global <span class="v-red">ELEVATED</span></div>
    <div class="ind"><span class="d" style="background:#10b981;"></span>Systems <span class="v-green">OPERATIONAL</span></div>
  </div>
  <div class="row" style="gap:12px;">
    <div class="stat"><div class="v">847</div><div class="l">Active Sigs</div></div>
    <div class="stat"><div class="v" style="color:var(--accent-orange);">23</div><div class="l">Anomalies</div></div>
    <div class="stat"><div class="v" style="color:var(--accent-purple);">12.4M</div><div class="l">Records</div></div>
    <div class="stat"><div class="v" style="color:var(--accent-green);">99.2%</div><div class="l">Uptime</div></div>
    <div class="stat"><div class="v">42ms</div><div class="l">Latency</div></div>
  </div>
</div>
</body></html>
