<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="kicker">JetBrains Mono · telemetry & metrics</div>
  <div class="row" style="gap:24px; flex:1; align-items:flex-start;">
    <div class="col">
      <div style="font-family:var(--font-mono); font-weight:700; font-size:36px; color:var(--accent-cyan); line-height:1;">$20.0B</div>
      <div style="font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:var(--light-400);">Valuation</div>
    </div>
    <div class="col">
      <div style="font-family:var(--font-mono); font-weight:700; font-size:36px; color:var(--accent-purple); line-height:1;">0.92</div>
      <div style="font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:var(--light-400);">Threat score</div>
    </div>
    <div class="col">
      <div style="font-family:var(--font-mono); font-weight:700; font-size:36px; color:var(--accent-green); line-height:1;">85%</div>
      <div style="font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.16em; color:var(--light-400);">GPU Load</div>
    </div>
  </div>
  <div style="font-family:var(--font-mono); font-size:12px; color:var(--accent-cyan); background:var(--dark-700); padding:8px 12px; border-radius:8px; border:1px solid var(--glass-border);">
    somnus@unlimited:~/workspace$ python3 main.py
  </div>
</div>
</body></html>
