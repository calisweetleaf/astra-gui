<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<style>
  .b1 { width:96px; height:96px; border-radius:24px; background:linear-gradient(135deg,#3b82f6,#8b5cf6);
        display:flex; align-items:center; justify-content:center; color:#fff; font-size:38px;
        animation:glow 3s ease-in-out infinite; }
  @keyframes glow {
    0%,100%{ box-shadow:0 0 20px rgba(59,130,246,.4); }
    50%{ box-shadow:0 0 48px rgba(139,92,246,.6); }
  }
  .b2 { animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .b3 { animation:shift 6s ease-in-out infinite;
        background:linear-gradient(90deg,#3b82f6,#8b5cf6,#06b6d4,#3b82f6);
        background-size:300% 100%;
        -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
        font:800 28px/1 var(--font-interface); letter-spacing:-0.02em; }
  @keyframes shift { 0%,100%{ background-position:0% 50% } 50%{ background-position:100% 50% } }
  .lbl { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.14em; color:var(--light-400); }
</style>
<div class="card">
  <div class="kicker">Animation · pulse / glow / gradient-shift</div>
  <div class="row" style="gap:32px; flex:1; align-items:center; justify-content:center;">
    <div class="col" style="align-items:center; gap:8px;">
      <div class="b1 b2">⚡</div><div class="lbl">welcome icon · 3s</div>
    </div>
    <div class="col" style="align-items:center; gap:8px;">
      <div style="width:14px; height:14px; border-radius:50%; background:#10b981; animation:pulse-dot 2s ease-in-out infinite;"></div>
      <div class="lbl">status dot · 2s</div>
    </div>
    <div class="col" style="align-items:center; gap:8px;">
      <div class="b3">SOVEREIGN</div><div class="lbl">gradient text · 6s</div>
    </div>
  </div>
</div>
<style>@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}</style>
</body></html>
