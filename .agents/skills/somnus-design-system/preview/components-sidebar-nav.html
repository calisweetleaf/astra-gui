<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<style>
  .nav { width:100%; height:100%; padding:10px; box-sizing:border-box; display:flex; flex-direction:column; gap:4px;
         background:var(--dark-800); border:1px solid var(--glass-border); border-radius:12px; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:var(--light-300);
          font-family:var(--font-interface); font-size:13px; cursor:pointer; transition:all .25s var(--ease-smooth); }
  .item:hover { background:var(--dark-700); color:#fff; }
  .item.active { background:rgba(6,182,212,.15); color:#fff; box-shadow:inset 2px 0 0 var(--accent-cyan); }
  .item i { width:16px; text-align:center; color:var(--light-400); }
  .item.active i { color:var(--accent-cyan); }
  .item .ct { margin-left:auto; font-family:var(--font-mono); font-size:10px; color:var(--light-400); }
  .group { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.18em;
           color:var(--light-500); padding:8px 12px 4px; }
</style>
<div class="card tight" style="padding:12px;">
  <div class="nav">
    <div class="group">Workspace</div>
    <div class="item active"><i class="fas fa-comment"></i>Chat<span class="ct">12</span></div>
    <div class="item"><i class="fas fa-cube"></i>Artifacts<span class="ct">5</span></div>
    <div class="item"><i class="fas fa-folder"></i>Projects<span class="ct">3</span></div>
    <div class="item"><i class="fas fa-flask"></i>Research</div>
    <div class="group">Sovereign</div>
    <div class="item"><i class="fas fa-brain"></i>AI Training<span class="ct">GPU 85%</span></div>
    <div class="item"><i class="fab fa-git-alt"></i>Git Repos</div>
    <div class="item"><i class="fas fa-cog"></i>Settings</div>
  </div>
</div>
</body></html>
