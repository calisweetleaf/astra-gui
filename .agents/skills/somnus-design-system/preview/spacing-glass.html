<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body class="command">
<style>
  .glass { width:130px; height:120px; border-radius:18px; padding:14px; box-sizing:border-box;
           border:1px solid rgba(148,163,184,.12);
           backdrop-filter:blur(32px) saturate(1.2); -webkit-backdrop-filter:blur(32px) saturate(1.2);
           font-family:var(--font-mono); font-size:11px; color:var(--light-200);
           display:flex; flex-direction:column; justify-content:space-between; }
  .glass .l { font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.16em; color:var(--light-400); }
  .glass .a { font-family:var(--font-mono); font-size:10px; opacity:.7; }
</style>
<div class="card">
  <div class="kicker">Glass material · stacked opacity</div>
  <div class="row" style="gap:14px; flex:1; align-items:center;">
    <div class="glass" style="background:rgba(8,12,18,.96);"><div class="l">command</div><div class="a">α 0.96</div></div>
    <div class="glass" style="background:rgba(15,20,28,.92);"><div class="l">primary</div><div class="a">α 0.92</div></div>
    <div class="glass" style="background:rgba(22,29,39,.85);"><div class="l">secondary</div><div class="a">α 0.85</div></div>
    <div class="glass" style="background:rgba(31,41,55,.70);"><div class="l">tertiary</div><div class="a">α 0.70</div></div>
    <div class="glass" style="background:rgba(39,50,66,.60);"><div class="l">surface</div><div class="a">α 0.60</div></div>
  </div>
</div>
</body></html>
