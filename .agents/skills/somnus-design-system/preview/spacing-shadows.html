<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<style>
  .s { width:96px; height:72px; border-radius:14px;
       background:rgba(31,41,55,0.7); backdrop-filter:blur(20px);
       border:1px solid rgba(148,163,184,.12);
       display:flex; align-items:flex-end; padding:10px; box-sizing:border-box;
       font-family:var(--font-mono); font-size:10px; color:var(--light-300); text-transform:uppercase; letter-spacing:.12em; }
</style>
<div class="card">
  <div class="kicker">Shadows + glow</div>
  <div class="row" style="gap:18px; flex:1; align-items:center;">
    <div class="s" style="box-shadow:0 4px 16px rgba(0,0,0,.25);">sm</div>
    <div class="s" style="box-shadow:0 8px 32px rgba(0,0,0,.30);">glass</div>
    <div class="s" style="box-shadow:0 16px 64px rgba(0,0,0,.60);">panel</div>
    <div class="s" style="box-shadow:0 24px 96px rgba(0,0,0,.85);">command</div>
    <div class="s" style="box-shadow:0 0 40px rgba(6,182,212,.45); border-color:rgba(6,182,212,.45);">glow cyan</div>
    <div class="s" style="box-shadow:0 0 40px rgba(139,92,246,.45); border-color:rgba(139,92,246,.45);">glow violet</div>
  </div>
</div>
</body></html>
